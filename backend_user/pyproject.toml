[project]
name = "ai-job-coach-backend"
version = "0.1.0"
description = "FastAPI backend for the AI job coach demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "pyjwt==2.13.0",
  "pwdlib[argon2]==0.3.0",
  "rich==15.0.0",
  "redis==8.1.0",
  "uvicorn[standard]==0.52.1",
  "google-genai==2.17.0",
  "httpx==0.28.1",
]

[project.scripts]
ai-job-coach-cli = "app.cli.app:main"
create-demo-user = "app.cli.create_demo_user:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
